bio:
    Yu Zhi is currently a Ph.D. candidate in theoretical physics at the University of Virginia. He studied at the University of Cambridge, where he received an M.Phil. in Physics in 2024, before continuing his doctoral studies in Physics at the University of Virginia. His research interests include quantum field theory, particle physics, astrophysics, and physics beyond the Standard Model.

