{{ $item := .item }}

<div class="pub-list-item" style="margin-bottom: 2rem;">

  <!-- Title -->
  <div class="pub-title" style="font-weight: 700; margin-bottom: 0.35rem;">
    <a href="{{ $item.RelPermalink }}">{{ $item.Title }}</a>
  </div>

  <!-- Authors -->
  <div class="pub-authors" style="margin-bottom: 0.2rem;">
    {{ partial "page_metadata_authors" $item }}
  </div>

  <!-- Journal / publication -->
  {{ with $item.Params.publication }}
  <div class="pub-journal" style="margin-bottom: 0.35rem;">
    {{ . | $item.RenderString }}
  </div>
  {{ end }}

  <!-- Links -->
  <div class="btn-links">
    {{ partial "page_links" (dict "page" $item "is_list" 1) }}
  </div>

</div>
